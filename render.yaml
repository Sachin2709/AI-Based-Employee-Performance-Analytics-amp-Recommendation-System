services:
  - type: web
    name: employee-analytics-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CLIENT_URL
        sync: false

  - type: web
    name: employee-analytics-frontend
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://ai-based-employee-performance-analytics-cesd.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
